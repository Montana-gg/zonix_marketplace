<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Zonix Marketplace{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Темно-синий фон навбара для контраста */
        .navbar { background-color: #1e293b; }
        .footer { background-color: #0f172a; color: white; padding: 20px 0; margin-top: 50px; }

        /* Имя пользователя теперь синее и заметное */
        .profile-link {
            color: #3b82f6 !important;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s;
        }
        .profile-link:hover { color: #60a5fa !important; text-decoration: underline; }

        /* Кастомный синий цвет для кнопок, чтобы не зависеть от стандартов Bootstrap */
        .btn-blue {
            background-color: #2563eb !important;
            border-color: #2563eb !important;
            color: white !important;
        }
        .btn-blue:hover {
            background-color: #1d4ed8 !important;
            border-color: #1d4ed8 !important;
        }
        .btn-outline-blue {
            color: #3b82f6 !important;
            border-color: #3b82f6 !important;
        }
        .btn-outline-blue:hover {
            background-color: #3b82f6 !important;
            color: white !important;
        }
        /* Контейнер для навигационных кнопок */
        .nav-icon-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #ffffff !important;
            text-decoration: none;
            font-size: 0.85rem; /* Размер текста под иконкой */
            transition: color 0.2s;
            padding: 0 10px;
            background: none;
            border: none;
        }

        .nav-icon-btn i {
            font-size: 1.5rem; /* Размер самой иконки */
            margin-bottom: 2px;
        }

        .nav-icon-btn:hover {
            color: #3b82f6 !important; /* Наш синий цвет при наведении */
        }

        /* Счетчик товаров в корзине (красный кружок) */
        .badge-notify {
            position: absolute;
            top: -5px;
            right: 2px;
            font-size: 0.7rem;
            padding: 3px 6px;
            border-radius: 50%;
            background-color: #ef4444; /* Красный как на скрине */
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'shop:product_list' %}">ZONIX</a>

            <form class="d-flex w-50" action="{% url 'shop:product_list' %}" method="get">
                <input class="form-control me-2" type="search" name="query" placeholder="Поиск товаров..." aria-label="Search">
                <button class="btn btn-blue" type="submit">Найти</button>
            </form>

            <div class="d-flex align-items-center gap-4">
                {% if user.is_authenticated %}
                    <a href="{% url 'profile' %}" class="nav-icon-btn">
                        <i class="bi bi-person"></i>
                        <span>{{ user.username }}</span>
                    </a>
                {% else %}
                    <a href="{% url 'login' %}" class="nav-icon-btn">
                        <i class="bi bi-person"></i>
                        <span>Войти</span>
                    </a>
                {% endif %}

                <a href="{% url 'cart:cart_detail' %}" class="nav-icon-btn position-relative">
                    <i class="bi bi-cart2"></i>
                    <span>Корзина</span>
                    {% with total_items=cart|length %}
                        {% if total_items > 0 %}
                            <span class="badge-notify">{{ total_items }}</span>
                        {% endif %}
                    {% endwith %}
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <footer class="footer text-center">
        <div class="container">
            <p>&copy; 2026 Zonix Marketplace — Быстрая доставка электроники</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
