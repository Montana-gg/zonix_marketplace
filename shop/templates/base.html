<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Velo Marketplace{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar { background-color: #232f3e; }
        .footer { background-color: #131a22; color: white; padding: 20px 0; margin-top: 50px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'shop:product_list' %}">VELO</a>
            <form class="d-flex w-50">
                <input class="form-control me-2" type="search" placeholder="Поиск товаров...">
                <button class="btn btn-outline-warning" type="submit">Найти</button>
            </form>
                <a href="{% url 'cart:cart_detail' %}" class="btn btn-outline-light position-relative">
                    🛒 Корзина
                    {% with total_items=cart|length %}
                        {% if total_items > 0 %}
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                                {{ total_items }}
                            </span>
                        {% endif %}
                    {% endwith %}
                </a>        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <footer class="footer text-center">
        <div class="container">
            <p>&copy; 2026 Velo Marketplace — Быстрая доставка электроники</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
