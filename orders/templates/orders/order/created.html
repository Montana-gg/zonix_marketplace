{% extends "base.html" %}

{% block title %}Заказ оформлен | Zonix{% endblock %}

{% block content %}
<div class="container my-5 text-center py-5">
    <div class="card shadow-sm border-0 p-5 mx-auto" style="max-width: 600px;">
        <div class="mb-4">
            <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
        </div>
        <h1 class="fw-bold text-dark mb-3">Спасибо за заказ!</h1>
        <p class="lead text-muted mb-4">
            Ваш заказ успешно создан. Номер вашего заказа: <strong class="text-primary">#{{ order.id }}</strong>.
        </p>
        <a href="{% url 'shop:product_list' %}" class="btn btn-primary btn-lg px-4 shadow-sm">
            Продолжить покупки
        </a>
    </div>
</div>
{% endblock %}
